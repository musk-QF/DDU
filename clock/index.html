<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Flip Clock V10 Final</title>


<style>

*{
box-sizing:border-box;
}


html,body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:Arial,sans-serif;

}



body{

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}




/* 主容器 */

.clock-wrapper{

position:absolute;

left:50%;
top:50%;

margin:0;

transform-origin:center center;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:5px;

}





.clock{

display:flex;

align-items:center;

gap:10px;

position:relative;

transform-origin:center center;

}






.flip{

width:88px;
height:120px;

position:relative;

perspective:1200px;

}





.page{

position:absolute;

left:0;

width:100%;

height:50%;

overflow:hidden;

background:
linear-gradient(#181818,#090909);

color:#fff;

font-size:108px;

font-weight:900;

}





.page span{

position:absolute;

width:100%;

text-align:center;

line-height:120px;

}





.top{

top:0;

border-radius:8px 8px 0 0;

}



.top span{

top:0;

}





.bottom{

bottom:0;

border-radius:0 0 8px 8px;

}



.bottom span{

top:-60px;

}







.line{

position:absolute;

top:59px;

width:100%;

height:2px;

background:#000;

z-index:20;

}









/* 翻页层 */

.anim{

position:absolute;

left:0;

width:100%;

height:50%;

overflow:hidden;

background:
linear-gradient(#181818,#090909);

color:#fff;

font-size:108px;

font-weight:900;

z-index:30;

backface-visibility:hidden;

box-shadow:
0 8px 15px rgba(0,0,0,.45);

}






.anim span{

position:absolute;

width:100%;

text-align:center;

line-height:120px;

}






.anim-top{

top:0;

transform-origin:bottom;

border-radius:8px 8px 0 0;

backface-visibility:hidden;

}





.anim-top span{

top:0;

}






.anim-bottom{

bottom:0;

transform-origin:top;

border-radius:0 0 8px 8px;

backface-visibility:hidden;

z-index:40;

}




.anim-bottom span{

top:-60px;

}






.flip-top{

animation:

flipTop .4s cubic-bezier(.55,.05,.25,1.15) forwards;

}






.flip-bottom{

animation:

flipBottom .35s .35s linear forwards;

}





@keyframes flipTop{


0%{

transform:
rotateX(0deg);

filter:brightness(1);

}



35%{

transform:
rotateX(-45deg);

filter:brightness(.85);

}



70%{

transform:
rotateX(-75deg);

filter:brightness(.7);

}



100%{

transform:
rotateX(-90deg);

filter:brightness(.55);

}

}






@keyframes flipBottom{


from{

transform:rotateX(90deg);

}


to{

transform:rotateX(0deg);

}

}







.colon{

font-size:60px;

color:#555;

}





.ampm{

font-size:24px;

color:#aaa;

font-weight:bold;

margin-left:15px;

}







.date{

margin-top:50px;

font-size:12px;

letter-spacing:5px;

color:#aaa;

transition:.25s;

}







/* 顶部按钮 */

.float-buttons{


position:fixed;

right:25px;

top:25px;

display:flex;

gap:15px;

opacity:0;

pointer-events:none;

transition:.3s;

z-index:999;

}




.float-buttons.show{

opacity:1;

pointer-events:auto;

}





.float-buttons button{


width:45px;

height:45px;

border-radius:50%;

border:1px solid #555;

background:#222;

color:white;

font-size:22px;

cursor:pointer;

}







/* 设置窗口 */


#settingsPanel{


display:none;

position:fixed;

right:25px;

top:80px;

width:260px;

padding:20px;

background:rgba(20,20,20,.95);

border:1px solid #444;

border-radius:12px;

color:white;

z-index:999;

}

#settingsPanel.show{

display:block;

}


.setting-row{


display:flex;

justify-content:space-between;

align-items:center;

margin:15px 0;

}




.scale-control{


display:flex;

align-items:center;

justify-content:center;

gap:15px;

}




.scale-control button{


width:45px;

height:35px;

font-size:24px;

background:#333;

color:white;

border:1px solid #666;

border-radius:6px;

cursor:pointer;

}

</style>


</head>


<body>



<!-- 顶部隐藏按钮 -->

<div class="float-buttons" id="floatButtons">


<button id="fullscreenBtn">
⛶
</button>


<button id="settingsBtn">
⚙
</button>


</div>






<!-- 设置窗口 -->


<div id="settingsPanel">


<h3 id="settingTitle">
设置
</h3>



<div class="setting-row">

<span>
显示日期
</span>


<input type="checkbox" id="dateSwitch">

</div>





<div class="setting-row">


<span>
24小时制
</span>


<input type="checkbox" id="hourSwitch">


</div>





<div class="setting-row">


<span>
显示秒数
</span>


<input type="checkbox" id="secondSwitch">


</div>





<div class="setting-row">


<span>
屏幕常亮
</span>


<input type="checkbox" id="awakeSwitch">


</div>


<div class="setting-row">

<span id="langText">
language
</span>

<select id="langSwitch">

<option value="zh">中文</option>

<option value="en">English</option>

</select>

</div>



<div class="scale-control">


<button id="zoomOut">
-
</button>


<span id="scaleValue">
100%
</span>


<button id="zoomIn">
+
</button>


</div>



</div>









<div class="clock-wrapper" id="clockWrapper">


<div class="clock" id="clock"></div>


<div class="date" id="date"></div>



</div>









<script>

class FlipDigit{
constructor(v){
this.value=v;
this.el=document.createElement("div");
this.el.className="flip";
this.el.innerHTML=`
<div class="page top"><span>${v}</span></div>
<div class="page bottom"><span>${v}</span></div>
<div class="line"></div>`;
}

set(v){
if(v===this.value)return;

let old=this.value;

this.el.querySelector(".top span").textContent=v;

let top=document.createElement("div");
top.className="anim anim-top";
top.innerHTML=`<span>${old}</span>`;
this.el.appendChild(top);

requestAnimationFrame(()=>top.classList.add("flip-top"));

setTimeout(()=>{
top.remove();
this.el.querySelector(".bottom span").textContent=v;
this.value=v;
},350);
}
}

const clock=document.getElementById("clock");
const dateBox=document.getElementById("date");
const clockWrapper=document.getElementById("clockWrapper");
const scaleValue=document.getElementById("scaleValue");

let digits=[];
for(let i=0;i<6;i++){
let d=new FlipDigit("0");
digits.push(d);
clock.appendChild(d.el);

if(i===1||i===3){
let c=document.createElement("div");
c.className="colon";
c.innerHTML=":";
clock.appendChild(c);
}
}

let ampm=document.createElement("div");
ampm.className="ampm";
clock.appendChild(ampm);


// =============================
// 设置读取
// =============================
let saveData=JSON.parse(localStorage.getItem("flipClockSetting")||"{}");

let lang = localStorage.getItem("clockLang") || "zh";


const langText = {

zh:{
setting:"设置",
date:"显示日期",
hour:"24小时制",
second:"显示秒数",
awake:"屏幕常亮",
language:"language",
week:["日","一","二","三","四","五","六"]
},

en:{
setting:"Settings",
date:"Show Date",
hour:"24 Hour",
second:"Show Seconds",
awake:"Keep Screen Awake",
language:"语言",
week:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
}

};

let showDate = saveData.showDate ?? true;
let is24Hour = saveData.is24Hour ?? true;
let showSecond = saveData.showSecond ?? false;
let clockScale = saveData.clockScale ?? 1;
const baseScale = 3;
const maxScale = 2;
const minScale = 0.5;


// =============================
// 语言切换
// =============================
function changeLanguage(){
let t = langText[lang];
document.getElementById("settingTitle").innerHTML = t.setting;
dateSwitch.parentElement.querySelector("span").innerHTML = t.date;
hourSwitch.parentElement.querySelector("span").innerHTML = t.hour;
secondSwitch.parentElement.querySelector("span").innerHTML = t.second;
awakeSwitch.parentElement.querySelector("span").innerHTML = t.awake;
document.getElementById("langText").innerHTML = t.language;
}

// =============================
// 缩放逻辑
// =============================
function applyScale(){
let screenW = window.innerWidth;
let screenH = window.innerHeight;

let baseWidth = 2400;
let baseHeight = 550;

let fitScale = Math.max(
    Math.min(
        screenW / baseWidth,
        screenH / baseHeight
    ),
    0.5
);

let finalScale = fitScale * baseScale * clockScale;

clockWrapper.style.transform = `translate(-50%,-50%) scale(${finalScale})`;
scaleValue.innerHTML = Math.round(clockScale*100)+"%";
saveSetting();
}

window.addEventListener("resize", applyScale);

// =============================
// 更新时间
// =============================
function update(){
let now=new Date();
let hour=now.getHours();
let suffix="";

if(!is24Hour){
suffix=hour>=12?"PM":"AM";
hour=hour%12||12;
}

let str = String(hour).padStart(2,"0") + String(now.getMinutes()).padStart(2,"0");
if(showSecond){
    str += String(now.getSeconds()).padStart(2,"0");
}

str.split("").forEach((v,i)=>{
    if(digits[i]){
        digits[i].set(v);
    }
});

if(showSecond){
    digits[4].el.style.display="block";
    digits[5].el.style.display="block";
    document.querySelectorAll(".colon")[1].style.display="block";
}else{
    digits[4].el.style.display="none";
    digits[5].el.style.display="none";
    document.querySelectorAll(".colon")[1].style.display="none";
}

ampm.style.display=is24Hour?"none":"block";
ampm.innerHTML=suffix;

let week=langText[lang].week[now.getDay()];
if(lang==="zh"){
dateBox.innerHTML=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${week}`;
}else{
dateBox.innerHTML=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${week}`;
}
dateBox.style.display=showDate?"block":"none";
}

// =============================
// 保存配置
// =============================
function saveSetting(){
localStorage.setItem("flipClockSetting",
JSON.stringify({
showDate,
is24Hour,
showSecond,
clockScale,
language:lang
}));
}


// =============================
// 初始化
// =============================
dateSwitch.checked=showDate;
hourSwitch.checked=is24Hour;
secondSwitch.checked=showSecond;
langSwitch.value = lang;

changeLanguage();
applyScale();
update();
setInterval(update,1000);



// =============================
// 缩放按钮事件
// =============================
zoomIn.onclick=()=>{
clockScale=Math.min(maxScale,clockScale+0.1);
applyScale();
};

zoomOut.onclick=()=>{
clockScale=Math.max(minScale,clockScale-0.1);
applyScale();
};

dateSwitch.onchange=()=>{showDate=dateSwitch.checked;update();saveSetting()}
hourSwitch.onchange=()=>{is24Hour=hourSwitch.checked;update();saveSetting()}
secondSwitch.onchange=()=>{showSecond=secondSwitch.checked;update();saveSetting()}

langSwitch.onchange=()=>{
lang = langSwitch.value;
localStorage.setItem("clockLang",lang);
changeLanguage();
saveSetting();
};

// =============================
// 屏幕常亮
// =============================
let wakeLock=null;
awakeSwitch.onchange=async function(){
if(this.checked){
try{
wakeLock=await navigator.wakeLock.request("screen");
}catch(e){
alert("不支持常亮");
this.checked=false;
}
}else{
if(wakeLock){
wakeLock.release();
wakeLock=null;
}
}
};


// =============================
// 设置面板
// =============================
settingsBtn.onclick=e=>{
e.stopPropagation();
settingsPanel.classList.toggle("show");
};

settingsPanel.addEventListener("click",function(e){
e.stopPropagation();
});

document.addEventListener("click",function(e){
if(!settingsPanel.contains(e.target) && e.target!==settingsBtn){
settingsPanel.classList.remove("show");
}
});


// =============================
// 全屏
// =============================
fullscreenBtn.onclick=()=>{
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
};


// =============================
// 鼠标悬浮显示按钮
// =============================
let hideTimer;
function showButtons(){
floatButtons.classList.add("show");
clearTimeout(hideTimer);
hideTimer=setTimeout(()=>{
floatButtons.classList.remove("show");
},3000);
}

document.addEventListener("mousemove",showButtons);
document.addEventListener("touchstart",showButtons);

</script>


</body>

</html>
