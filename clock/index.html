<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Flip Clock</title>


<style>

*{
box-sizing:border-box;
}


html,body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:Arial,sans-serif;

}



body{

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}




/* 主容器 */

.clock-wrapper{

position:absolute;

left:50%;
top:50%;

margin:0;



transform-origin:center center;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:5px;   /* ⭐ 时钟和日期间隔100px */


}





.clock{

display:flex;

align-items:center;

gap:10px;

position:relative;



transform-origin:center center;



}






.flip{

width:88px;
height:120px;

position:relative;

perspective:1200px;

}





.page{

position:absolute;

left:0;

width:100%;

height:50%;

overflow:hidden;

background:
linear-gradient(#181818,#090909);

color:#fff;

font-size:108px;

font-weight:900;

}





.page span{

position:absolute;

width:100%;

text-align:center;

line-height:120px;

}





.top{

top:0;

border-radius:8px 8px 0 0;

}



.top span{

top:0;

}





.bottom{

bottom:0;

border-radius:0 0 8px 8px;

}



.bottom span{

top:-60px;

}







.line{

position:absolute;

top:59px;

width:100%;

height:2px;

background:#000;

z-index:20;

}









/* 翻页层 */

.anim{

position:absolute;

left:0;

width:100%;

height:50%;

overflow:hidden;

background:
linear-gradient(#181818,#090909);

color:#fff;

font-size:108px;

font-weight:900;

z-index:30;

backface-visibility:hidden;

box-shadow:
0 8px 15px rgba(0,0,0,.45);

}






.anim span{

position:absolute;

width:100%;

text-align:center;

line-height:120px;

}






.anim-top{

top:0;

transform-origin:bottom;

border-radius:8px 8px 0 0;

backface-visibility:hidden;

}





.anim-top span{

top:0;

}






.anim-bottom{

bottom:0;

transform-origin:top;

border-radius:0 0 8px 8px;

backface-visibility:hidden;

z-index:40;

}




.anim-bottom span{

top:-60px;

}






.flip-top{

animation:

flipTop .4s cubic-bezier(.55,.05,.25,1.15) forwards;

}






.flip-bottom{

animation:

flipBottom .35s .35s linear both;

}





@keyframes flipTop{


0%{

transform:
rotateX(0deg);

filter:brightness(1);

}



35%{

transform:
rotateX(-45deg);

filter:brightness(.85);

}



70%{

transform:
rotateX(-75deg);

filter:brightness(.7);

}



100%{

transform:
rotateX(-90deg);

filter:brightness(.55);

}

}






@keyframes flipBottom{


from{

transform:rotateX(90deg);

}


to{

transform:rotateX(0deg);

}

}







.colon{

font-size:60px;

color:#555;

}





.ampm{

font-size:24px;

color:#aaa;

font-weight:bold;

margin-left:15px;

}







.date{

margin-top:50px;

font-size:12px;

letter-spacing:5px;

color:#aaa;

transition:.25s;

}







/* ========= 定时器 / 闹钟 / 番茄钟 ========= */

.mode-wrapper{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
gap:22px;
color:#fff;
}

.mode-wrapper.show{
display:flex;
}

.flip-display{
display:flex;
align-items:center;
gap:10px;
}

.phase-label{
font-size:20px;
letter-spacing:6px;
color:#aaa;
}

.phase-label.work{color:#fff;}
.phase-label.rest{color:#888;}

.pomodoro-count{
font-size:13px;
color:#888;
letter-spacing:2px;
}

.control-row{
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

.ctrl-btn{
padding:10px 24px;
font-size:14px;
letter-spacing:2px;
background:transparent;
color:#bbb;
border:1px solid #444;
border-radius:20px;
cursor:pointer;
transition:.2s;
}

.ctrl-btn:hover{
color:#fff;
border-color:#fff;
background:rgba(255,255,255,.12);
}

/* 闹钟面板 */

.alarm-panel{
width:min(400px,94vw);
display:flex;
flex-direction:column;
gap:16px;
align-items:stretch;
}

.alarm-add-box{
background:#141414;
border:1px solid #333;
border-radius:10px;
padding:14px;
display:flex;
flex-direction:column;
gap:12px;
}

.weekday-picker{
display:flex;
gap:6px;
justify-content:center;
}

.weekday-btn{
width:34px;
height:34px;
border-radius:50%;
border:1px solid #444;
background:transparent;
color:#888;
font-size:12px;
cursor:pointer;
transition:.2s;
}

.weekday-btn:hover{
color:#fff;
border-color:#fff;
background:rgba(255,255,255,.12);
}

.weekday-btn.active{
border-color:#fff;
color:#fff;
}

.alarm-hint{
font-size:11px;
color:#777;
text-align:center;
letter-spacing:1px;
}

.alarm-list{
display:flex;
flex-direction:column;
gap:10px;
max-height:38vh;
overflow-y:auto;
}


.alarm-item.off{opacity:.4;}



#alarmWrapper{
max-height:96vh;
overflow-y:auto;
scrollbar-width:none;
}

#alarmWrapper::-webkit-scrollbar{display:none;}

.next-box{
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
zoom:1.25;
margin-bottom:8px;
}

.next-label{
font-size:11px;
color:#777;
letter-spacing:3px;
text-transform:uppercase;
}

.next-sub{
font-size:13px;
color:#aaa;
letter-spacing:1px;
}

.next-box.none .flip-display{opacity:.3;}

.add-top{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
}

.add-side{
display:flex;
flex-direction:column;
gap:12px;
align-items:stretch;
}

.add-side input[type="text"]{
background:#1c1c1c;
border:1px solid #555;
color:#fff;
border-radius:6px;
padding:8px 10px;
font-size:14px;
width:150px;
}

.wheel-wrap{
position:relative;
display:flex;
align-items:center;
gap:2px;
background:#0d0d0d;
border:0.5px solid #222;
border-radius:10px;
padding:0 10px;
}

.wheel{
height:170px;
width:60px;
padding:68px 0;
overflow-y:scroll;
scroll-snap-type:y mandatory;
scrollbar-width:none;
cursor:pointer;
-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
}

.wheel::-webkit-scrollbar{display:none;}

.wheel div{
height:34px;
line-height:34px;
text-align:center;
font-size:20px;
color:#555;
scroll-snap-align:center;
user-select:none;
font-variant-numeric:tabular-nums;
}

.wheel div.sel{
color:#fff;
font-weight:700;
font-size:25px;
}

.wheel-colon{
color:#777;
font-size:22px;
}

.wheel-band{
position:absolute;
left:8px;
right:8px;
top:68px;
height:34px;
border-top:1px solid #3a3a3a;
border-bottom:1px solid #3a3a3a;
pointer-events:none;
}

/* ===== 纯黑白 ===== */

html{color-scheme:dark;}

::selection{background:#fff;color:#000;}

input[type="checkbox"]{accent-color:#fff;}

#langSwitch{
background:#1c1c1c;
color:#fff;
border:1px solid #555;
border-radius:6px;
padding:4px 8px;
}

:focus-visible{
outline:1px solid #fff;
outline-offset:2px;
}

.float-buttons button{
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

.float-buttons button svg{
width:22px;
height:22px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

/* ===== 小号滚轮（定时器 / 番茄钟） ===== */

.wheel-wrap.sm{
gap:8px;
padding:10px 14px;
}

.wheel-wrap.disabled{
opacity:.4;
pointer-events:none;
}

.wheel-box{position:relative;}
.wheel-box.sm{--h:28px;}

.wheel.sm{
height:calc(var(--h)*5);
width:54px;
padding:calc(var(--h)*2) 0;
}

.wheel.sm div{
height:var(--h);
line-height:var(--h);
font-size:17px;
}

.wheel.sm div.sel{font-size:21px;}

.wheel-band.sm{
left:0;
right:0;
top:calc(var(--h)*2);
height:var(--h);
}

.wheel-col{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

.wheel-cap{
font-size:12px;
color:#aaa;
letter-spacing:2px;
}

.wheel-unit{
font-size:13px;
color:#aaa;
letter-spacing:2px;
}

.wheel-foot{
font-size:12px;
color:#777;
letter-spacing:2px;
}

/* ===== 鼠标移动时显示，不动后自动隐藏 ===== */

.idle-hide{
opacity:0;
pointer-events:none;
transition:opacity .3s;
}

body.ui-active .idle-hide{
opacity:1;
pointer-events:auto;
}

body.ui-active .idle-hide.disabled{
opacity:.4;
pointer-events:none;
}

/* ===== 番茄钟：轮次圆点 ===== */

.pomo-dots{
display:flex;
align-items:center;
gap:14px;
height:12px;
}

.pomo-dot{
width:10px;
height:10px;
border-radius:50%;
background:#333;
transition:background .3s;
}

.pomo-dot.done{background:#fff;}
.pomo-dot.cur{background:#aaa;}

.pomo-dots.running .pomo-dot.cur{
animation:dotBlink 1s ease-in-out infinite;
}

@keyframes dotBlink{
0%,100%{background:#fff;opacity:1;}
50%{background:#fff;opacity:.15;}
}

/* ===== 番茄钟：设置区与说明 ===== */

.pomo-settings{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.pomo-note{
max-width:440px;
text-align:center;
}

.pomo-note-title{
font-size:15px;
color:#ddd;
letter-spacing:2px;
margin-bottom:6px;
}

.pomo-note-body{
font-size:12px;
line-height:1.7;
color:#888;
letter-spacing:1px;
}

#addAlarmBtn{
padding:6px 16px;
font-size:12px;
}

.mode-wrapper{width:max-content;}

.ctrl-btn:disabled{
opacity:.35;
pointer-events:none;
}

.lap-box{
width:300px;
display:none;
}

.lap-box.has{display:block;}

.lap-row{
display:grid;
grid-template-columns:44px 1fr 1fr;
gap:8px;
padding:6px 10px;
font-size:13px;
color:#ddd;
text-align:center;
font-variant-numeric:tabular-nums;
border-bottom:0.5px solid #1c1c1c;
}

.lap-row span:first-child{color:#777;}
.lap-row:not(.lap-head) span:nth-child(2){color:#fff;}
.lap-row:not(.lap-head) span:nth-child(3){color:#666;}

.lap-head{
font-size:11px;
letter-spacing:2px;
color:#777;
border-bottom:0.5px solid #333;
}

.lap-list{
max-height:140px;
overflow-y:auto;
scrollbar-width:none;
}

.lap-list::-webkit-scrollbar{display:none;}
.mode-wrapper .flip{flex-shrink:0;}

.alarm-head{
display:flex;
align-items:center;
justify-content:space-between;
}

.alarm-title{
font-size:12px;
color:#777;
letter-spacing:3px;
text-transform:uppercase;
}

#alarmAddToggle{
padding:6px 14px;
font-size:12px;
}

#alarmAddToggle::before{
content:"+ ";
}

.alarm-add-box{
display:none;
}

.alarm-add-box.open{
display:flex;
}

.alarm-item{
background:#0d0d0d;
border:0.5px solid #222;
border-radius:10px;
padding:12px;
display:flex;
align-items:center;
gap:12px;
}

.alarm-item.off{opacity:.45;}

.alarm-cards{
display:flex;
align-items:center;
gap:4px;
}

.fc{
width:28px;
height:40px;
background:linear-gradient(#181818,#090909);
border-radius:5px;
position:relative;
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
font-weight:900;
color:#fff;
}

.fc::after{
content:"";
position:absolute;
left:0;
right:0;
top:50%;
height:1.5px;
background:#000;
}

.fc-colon{
color:#555;
font-size:20px;
margin:0 2px;
}

.alarm-info{
flex:1;
min-width:0;
padding-left:4px;
}

.alarm-name{
font-size:12px;
color:#aaa;
margin-bottom:4px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.alarm-days{
display:flex;
gap:7px;
font-size:11px;
color:#555;
}

.alarm-days .on{color:#fff;}

.alarm-empty{
text-align:center;
font-size:12px;
color:#666;
letter-spacing:1px;
padding:18px 0;
}

.alarm-actions{
display:flex;
align-items:center;
gap:10px;
}

.alarm-del{
background:none;
border:none;
color:#888;
font-size:18px;
cursor:pointer;
transition:.2s;
}

.alarm-del:hover{
color:#fff;
}

.switch{
position:relative;
width:40px;
height:22px;
flex-shrink:0;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
inset:0;
background:#444;
border-radius:22px;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:16px;
height:16px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked + .slider{background:#888;}
.switch input:checked + .slider:before{transform:translateX(18px);}

/* 到时提醒弹层 */

.ring-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.ring-overlay.show{display:flex;}

.ring-box{
text-align:center;
color:#fff;
}

.ring-title{
font-size:34px;
letter-spacing:4px;
margin-bottom:10px;
animation:pulse 1s infinite;
}

.ring-sub{
font-size:15px;
color:#aaa;
margin-bottom:30px;
letter-spacing:2px;
}

@keyframes pulse{
0%,100%{opacity:1;}
50%{opacity:.4;}
}

/* 顶部按钮 */

.float-buttons{


position:fixed;

right:25px;

top:25px;

display:flex;

gap:15px;

opacity:0;

pointer-events:none;

transition:.3s;

z-index:999;

}




.float-buttons.show{

opacity:1;

pointer-events:auto;

}





.float-buttons button{


width:45px;

height:45px;

border-radius:50%;

border:none;

background:transparent;

color:#777;

font-size:22px;

cursor:pointer;

transition:color .2s;

}

.float-buttons button:hover{
color:#fff;
}

.float-buttons button.active{
color:#fff;
}







/* 设置窗口 */


#settingsPanel{


display:none;

position:fixed;

right:25px;

top:80px;

width:260px;

padding:20px;

background:rgba(20,20,20,.95);

border:1px solid #444;

border-radius:12px;

color:white;

z-index:999;

}

#settingsPanel.show{

display:block;

}


.setting-row{


display:flex;

justify-content:space-between;

align-items:center;

margin:15px 0;

}




.scale-control{


display:flex;

align-items:center;

justify-content:center;

gap:15px;

}




.scale-control button{


width:45px;

height:35px;

font-size:24px;

background:#333;

color:white;

border:1px solid #666;

border-radius:6px;

cursor:pointer;

}






/* 手机竖屏 */










/* ===================================================
   新增：防烧屏、亮度、提示、预设、窄屏适配、对比度
   =================================================== */

.clock-wrapper{width:max-content;}

/* 防烧屏位移：用独立的 translate 属性，不影响缩放用的 transform */
.clock-wrapper,
.mode-wrapper{
translate:var(--sx,0px) var(--sy,0px);
transition:translate 4s ease-in-out;
}

#dimLayer{
position:fixed;
inset:0;
background:#000;
opacity:0;
pointer-events:none;
z-index:500;
transition:opacity 2s linear;
}

#toastBox{
position:fixed;
left:50%;
bottom:40px;
transform:translateX(-50%);
max-width:90vw;
padding:10px 18px;
background:#1c1c1c;
border:1px solid #444;
border-radius:20px;
color:#ddd;
font-size:13px;
text-align:center;
opacity:0;
pointer-events:none;
transition:opacity .3s;
z-index:1100;
}

#toastBox.show{opacity:1;}

#settingsPanel{
max-height:calc(100vh - 100px);
overflow-y:auto;
scrollbar-width:thin;
}

#settingsPanel input[type="range"]{
width:120px;
accent-color:#fff;
color:#999;
border-color:#999;
outline-color:#fff;
}

#settingsPanel select{
background:#1c1c1c;
color:#fff;
border:1px solid #555;
border-radius:6px;
padding:4px 8px;
}

.chip-row{
display:flex;
gap:8px;
justify-content:center;
flex-wrap:wrap;
}

.chip{
padding:5px 12px;
font-size:12px;
letter-spacing:1px;
}

.ring-actions{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

.ring-box .ctrl-btn{
padding:12px 30px;
font-size:16px;
}

.alarm-edit{
background:none;
border:none;
color:#888;
cursor:pointer;
padding:0;
display:flex;
align-items:center;
transition:.2s;
}

.alarm-edit:hover{color:#fff;}

.alarm-edit svg{
width:16px;
height:16px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.alarm-item.editing{border-color:#fff;}

.alarm-note{
font-size:12px;
color:#8a8a8a;
text-align:center;
letter-spacing:1px;
}

/* ---- 对比度：小字号的暗灰文字整体提亮 ---- */
.float-buttons button{color:#8a8a8a;}
.float-buttons button:hover,
.float-buttons button.active{color:#fff;}

.wheel div{color:#6e6e6e;}
.wheel div.sel{color:#fff;}

.weekday-btn{color:#8a8a8a;}
.weekday-btn.active{color:#fff;}

.alarm-days{color:#7a7a7a;font-size:12px;gap:5px;}

.alarm-item{gap:10px;}
.alarm-info{min-width:116px;}
.alarm-actions{gap:8px;}
.alarm-days .on{color:#fff;}

.alarm-hint,
.alarm-title,
.next-label,
.lap-head,
.wheel-foot{
color:#8a8a8a;
}

.alarm-hint{font-size:12px;}
.lap-head{font-size:12px;}
.wheel-foot{font-size:13px;}

.lap-row span:first-child{color:#8a8a8a;}
.lap-row:not(.lap-head) span:nth-child(3){color:#8a8a8a;}

.pomo-note-body{color:#9a9a9a;font-size:13px;}

.wheel-cap,
.wheel-unit{
color:#b0b0b0;
font-size:13px;
}

/* ---- 窄屏（手机竖屏）适配 ---- */
@media (max-width:520px){
.float-buttons{right:6px;top:6px;gap:0;}
.float-buttons button{width:40px;height:40px;}
#settingsPanel{left:8px;right:8px;width:auto;top:56px;}
.add-top{flex-wrap:wrap;}
.alarm-item{flex-wrap:wrap;}
.alarm-info{order:3;flex:1 1 100%;padding-left:0;}
.alarm-actions{margin-left:auto;}
}


/* ===================================================
   世界时钟
   =================================================== */

#alarmWrapper,
#worldWrapper{
max-height:96vh;
overflow-y:auto;
scrollbar-width:none;
}

#worldWrapper::-webkit-scrollbar{display:none;}

.world-panel{
width:min(480px,94vw);
display:flex;
flex-direction:column;
gap:14px;
}

.world-controls{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.seg{
display:inline-flex;
border:1px solid #444;
border-radius:16px;
overflow:hidden;
}

.seg-btn{
background:transparent;
color:#8a8a8a;
border:none;
padding:6px 14px;
font-size:12px;
letter-spacing:1px;
cursor:pointer;
transition:.2s;
}

.seg-btn:hover{color:#fff;}

.seg-btn.active{
color:#fff;
background:rgba(255,255,255,.14);
}

#worldAddBtn{
padding:6px 14px;
font-size:12px;
}

#worldAddBtn::before{content:"+ ";}

.world-plan{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.world-list{
display:flex;
flex-direction:column;
gap:8px;
max-height:42vh;
overflow-y:auto;
scrollbar-width:none;

class FlipDigit{
constructor(v){
this.value=v;      // 画面上已经显示的值
this.target=v;     // 最新要翻到的值
this.timers=[];
this.el=document.createElement("div");
this.el.className="flip";
this.el.innerHTML=`
<div class="page top"><span>${v}</span></div>
<div class="page bottom"><span>${v}</span></div>
<div class="line"></div>`;
}

// 立刻结束正在进行的翻页，画面直接落到最新值
finish(){
this.timers.forEach(clearTimeout);
this.timers=[];
this.el.querySelectorAll(".anim").forEach(e=>e.remove());
this.el.querySelector(".top span").textContent=this.target;
this.el.querySelector(".bottom span").textContent=this.target;
this.value=this.target;
}

set(v){
// 目标值没变就不重复触发（定时器刷新比动画快，不判断会叠出多层翻页）
if(v===this.target)return;

this.finish();

let old=this.value;
this.target=v;

// 上半页底层立即换成新值（翻走后即可见）
this.el.querySelector(".top span").textContent=v;

let top=document.createElement("div");
top.className="anim anim-top";
top.innerHTML=`<span>${old}</span>`;
this.el.appendChild(top);

let bottom=document.createElement("div");
bottom.className="anim anim-bottom";
bottom.innerHTML=`<span>${v}</span>`;
this.el.appendChild(bottom);

requestAnimationFrame(()=>{
top.classList.add("flip-top");
bottom.classList.add("flip-bottom");
});

// flip-top 时长 0.4s
this.timers.push(setTimeout(()=>{
top.remove();
},400));

// flip-bottom 延迟0.35s + 时长0.35s = 0.7s，播完再换真实下半页
this.timers.push(setTimeout(()=>{
bottom.remove();
this.el.querySelector(".bottom span").textContent=v;
this.value=v;
this.timers=[];
},700));
}
}

try{

return fallback;
}

function num(v,min,max,def){
v=Number(v);
return Number.isFinite(v) ? Math.min(max,Math.max(min,Math.round(v))) : def;
}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// =============================
// 计时器驱动：优先用 Web Worker，后台标签页里也不会被浏览器限速
// =============================
const tickTasks=new Map();
let tickSeq=0;

function setTick(fn,ms){
const id=++tickSeq;
tickTasks.set(id,{fn,ms,last:0});
return id;
}

function clearTick(id){
tickTasks.delete(id);
}

function runTicks(){
const now=performance.now();
tickTasks.forEach(t=>{
if(now-t.last>=t.ms-15){
t.last=now;
try{ t.fn(); }catch(e){ console.error(e); }
}
});
}

(function startTicker(){
let fallback=false;
function useFallback(){
if(fallback) return;
fallback=true;
setInterval(runTicks,250);
}
try{
const blob=new Blob(["setInterval(function(){postMessage(0)},250)"],{type:"text/javascript"});
const w=new Worker(URL.createObjectURL(blob));
w.onmessage=runTicks;
w.onerror=useFallback;
}catch(e){
useFallback();
}
})();

let audioCtx=null;

// 浏览器要求先有一次用户操作才能发声，这里在第一次操作时解锁
function unlockAudio(){
try{
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==="suspended") audioCtx.resume();
}catch(e){}
}

["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio));

function tone(freq,start,dur,type,peak){
const t=audioCtx.currentTime+start;
const osc=audioCtx.createOscillator();
const g=audioCtx.createGain();
osc.type=type;
osc.frequency.value=freq;
const p=Math.max(0.0002,peak*soundVolume/100);
g.gain.setValueAtTime(0.0001,t);
g.gain.exponentialRampToValueAtTime(p,t+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
osc.connect(g);
g.connect(audioCtx.destination);
osc.start(t);
osc.stop(t+dur+0.05);
}

function playRingOnce(){
if(!audioCtx || soundVolume<=0) return;
if(soundType==="bell"){
tone(1046,0,1.1,"sine",0.5);
tone(2093,0,0.6,"sine",0.15);
tone(1568,0.5,0.9,"sine",0.35);
}else if(soundType==="soft"){
tone(523,0,0.7,"triangle",0.5);
tone(659,0.3,0.7,"triangle",0.4);
}else{
tone(880,0,0.2,"sine",0.5);
tone(880,0.22,0.2,"sine",0.5);
}
}

function previewSound(){
unlockAudio();
playRingOnce();
}

let ringSoundId=null;

function startRingSound(){
stopRingSound();

playRingOnce();
ringSoundId=setTick(playRingOnce,1000);
}

}

// 到时提醒弹层（多个提醒会排队；最长响 60 秒；闹钟可「稍后提醒」）
// =============================
const RING_MAX_MS=60000;
let ringQueue=[];
let ringActive=false;
let ringCurrent=null;
let ringAutoId=null;

function showRing(title,sub,onDismiss,opts){
ringQueue.push({title,sub,onDismiss,snooze:(opts&&opts.snooze)||null});
if(!ringActive) nextRing();
}

function nextRing(){
clearTimeout(ringAutoId);
const item=ringQueue.shift();

if(!item){
ringActive=false;
ringCurrent=null;
ringOverlay.classList.remove("show");
applyDim();
updateTitle();
return;
}

ringActive=true;
ringCurrent=item;
ringTitle.textContent=item.title;
ringSub.textContent=item.sub||"";
ringSnoozeBtn.style.display=item.snooze ? "" : "none";
ringOverlay.classList.add("show");

startRingSound();
applyDim();
updateTitle();

// 页面就在眼前时已有全屏弹层，不再重复弹桌面通知
if(document.visibilityState!=="visible" || !document.hasFocus()){
notifyUser(item.title,item.sub);
}

ringStopBtn.focus({preventScroll:true});
ringAutoId=setTimeout(()=>closeRing(false),RING_MAX_MS);
}

function closeRing(snoozed){
stopRingSound();
clearTimeout(ringAutoId);
const item=ringCurrent;
ringCurrent=null;
if(item){
if(snoozed && item.snooze) item.snooze();
else if(item.onDismiss) item.onDismiss();
}
nextRing();
}

ringStopBtn.onclick=()=>closeRing(false);
ringSnoozeBtn.onclick=()=>closeRing(true);

// 响铃时：空格 / 回车 / Esc 都可以直接停止
document.addEventListener("keydown",e=>{
if(!ringActive) return;
if(e.key===" " || e.key==="Enter" || e.key==="Escape"){
e.preventDefault();
e.stopPropagation();
if(!e.repeat) closeRing(false);
}
},true);

function buildDHMS(container){

function renderDHMS(obj,total,level){
total=Math.max(0,total);
const d=Math.min(99,Math.floor(total/86400));
const h=Math.floor(total%86400/3600);
const m=Math.floor(total%3600/60);
const sec=total%60;
const str=pad2(d)+pad2(h)+pad2(m)+pad2(sec);

const start=level===2 ? 0 : level===1 ? 2 : 4;
obj.digits.forEach((dg,i)=>{
dg.el.style.display=i>=start ? "" : "none";
dg.set(str[i]);
});
obj.colons[0].style.display=level===2 ? "" : "none";
obj.colons[1].style.display=level>=1 ? "" : "none";
obj.colons[2].style.display="";
}

function durationText(total){
const t=T();
const d=Math.floor(total/86400), h=Math.floor(total%86400/3600), m=Math.floor(total%3600/60), sec=total%60;
const parts=[];
if(d) parts.push(fmt(t.uD,{n:d}));
if(h) parts.push(fmt(t.uH,{n:h}));
if(m) parts.push(fmt(t.uM,{n:m}));
if(sec||!parts.length) parts.push(fmt(t.uS,{n:sec}));
return parts.join(" ");
}

// 紧凑格式：分:秒 / 时:分:秒 / N天 时:分:秒
function fmtLap(sec){
const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60;
if(d>0) return d+T().dayShort+" "+pad2(h)+":"+pad2(m)+":"+pad2(s);
if(h>0) return pad2(h)+":"+pad2(m)+":"+pad2(s);
return pad2(m)+":"+pad2(s);
}

// =============================
// 滚动选择（鼠标滚轮 / 点击 / 触摸 / 键盘上下键），首尾相接无限循环
// =============================
function makeWheel(el,min,max,init,onChange,H=34,ariaKey=""){
const count=max-min+1;
const REPS=3;                       // 复制 3 份首尾相接，滚到头时悄悄跳回中间一份
const total=count*REPS;
let curPos=count+(init-min), target=curPos, idleTimer=null, acc=0, lastWheelAt=0;

el.tabIndex=0;
el.setAttribute("role","spinbutton");
el.setAttribute("aria-valuemin",min);
el.setAttribute("aria-valuemax",max);
if(ariaKey) el.dataset.ariaKey=ariaKey;

function value(p){
return min+((p%count)+count)%count;
}

for(let r=0;r<REPS;r++){
for(let i=0;i<count;i++){
const d=document.createElement("div");
d.textContent=pad2(min+i);
const pos=r*count+i;
d.onclick=()=>go(pos);
el.appendChild(d);
}
}

function mark(){
[...el.children].forEach((c,i)=>c.classList.toggle("sel",i===curPos));
el.setAttribute("aria-valuenow",value(curPos));
}

function go(p){
target=Math.max(0,Math.min(total-1,p));
lastWheelAt=performance.now();
el.scrollTo({top:target*H,behavior:"smooth"});
}

el.addEventListener("wheel",e=>{
e.preventDefault();
const dy=e.deltaMode===1 ? e.deltaY*33 : e.deltaY;
if(Math.abs(dy)>=50){
acc=0;                                   // 鼠标滚轮：一格 = 一个数字
go(target+(dy>0?1:-1));
}else{
acc+=dy;                                 // 触控板：累计到一定距离再走一格
if(Math.abs(acc)>=40){
go(target+(acc>0?1:-1));
acc=0;
}
}
},{passive:false});

el.addEventListener("keydown",e=>{
const k=e.key;
if(k==="ArrowDown") go(target+1);
else if(k==="ArrowUp") go(target-1);
else if(k==="PageDown") go(target+10);
else if(k==="PageUp") go(target-10);
else if(k==="Home") go(count);
else if(k==="End") go(count+count-1);
else return;
e.preventDefault();
});

el.addEventListener("scroll",()=>{
const p=Math.max(0,Math.min(total-1,Math.round(el.scrollTop/H)));
if(p!==curPos){
const old=value(curPos);
curPos=p;
mark();
const v=value(p);
if(v!==old) onChange(v);
}

clearTimeout(idleTimer);
idleTimer=setTimeout(()=>{
// 刚用滚轮操作过、却没滚到目标位置（连续快速滚动时偶尔会被打断）：补滚一次，不丢步数
if(target!==curPos && performance.now()-lastWheelAt<600){
el.scrollTo({top:target*H,behavior:"smooth"});
return;
}
target=curPos;
// 停下后，如果落在前后两份里，就无感跳回中间一份
if(curPos<count || curPos>=2*count){
curPos=count+((curPos%count)+count)%count;
target=curPos;
el.scrollTop=curPos*H;
mark();
}
},150);
});

mark();

return {
get:()=>value(curPos),
set(v){
v=Math.max(min,Math.min(max,v));
curPos=target=count+(v-min);
el.scrollTop=curPos*H;
mark();
onChange(v);
}
};
}


// =============================
// 缩放适配（时钟 / 定时器 / 秒表 / 番茄钟；内容太宽或太高时整体缩小到放得下）
// =============================
function fitWrapper(el,scale){
el.style.transform=`translate(-50%,-50%) scale(${scale})`;
if(getComputedStyle(el).display==="none") return;
const r=el.getBoundingClientRect();
if(!r.width || !r.height) return;
const k=Math.min(1,window.innerHeight*0.92/r.height,window.innerWidth*0.94/r.width);
if(k<1) el.style.transform=`translate(-50%,-50%) scale(${scale*k})`;
}

function applyScale(){
const W=window.innerWidth, H=window.innerHeight;

// 小屏自动缩小，大屏保持原尺寸（基准按带鱼屏）
const fitScale=Math.max(Math.min(W/2400,H/550),0.5);
const finalScale=fitScale*baseScale*clockScale;

// 控件（按钮、滚轮、说明）缩到时钟缩放的 1/3；窗口较小时设下限，保证文字看得清
const uiZoom=Math.max(1/3,1/finalScale);

[timerWrapper,stopwatchWrapper,pomodoroWrapper].forEach(el=>{
el.style.transform=`translate(-50%,-50%) scale(${finalScale})`;
el.querySelectorAll(".cz").forEach(c=>{
c.style.transform="none";
c.style.marginBottom="0px";
const h=c.offsetHeight;
c.style.transformOrigin="top center";
c.style.transform=`scale(${uiZoom})`;
c.style.marginBottom=`${-h*(1-uiZoom)}px`;
});
});

[clockWrapper,timerWrapper,stopwatchWrapper,pomodoroWrapper].forEach(el=>fitWrapper(el,finalScale));

// 闹钟页顶部的大号「下一个闹钟」，窄屏上缩小
const topZoom=Math.min(1.25,W*0.94/430);
nextBox.style.zoom=topZoom;
worldTop.style.zoom=topZoom*(worldWrapper.classList.contains("planning") ? 0.7 : 0.85);   // 世界时钟内容较多，顶部数字比闹钟页小一些

scaleValue.innerHTML=Math.round(clockScale*100)+"%";
}

// =============================
// 防烧屏：慢速呼吸（亮度每 5 分钟起伏一个周期）+ 像素位移（每 5 分钟微移几个像素）；手动亮度
// =============================
const BREATH_MS=5*60*1000;
const SHIFT_MS=5*60*1000;
const IDLE_MS=15000;
let lastActivity=Date.now();
let shiftBucket=-1, shiftX=0, shiftY=0;

function breathFactor(now){
if(!burnOn) return 1;
if(now-lastActivity<IDLE_MS || ringActive) return 1;    // 有操作、或正在响铃时保持全亮
return 0.775+0.225*Math.cos(2*Math.PI*(now%BREATH_MS)/BREATH_MS);   // 在 100% 和 55% 之间起伏
}

function applyDim(){
const f=breathFactor(Date.now());
dimLayer.style.opacity=String(Math.max(0,Math.min(0.9,1-(brightness/100)*f)));
}

function applyShift(force){
const bucket=Math.floor(Date.now()/SHIFT_MS);
if(!force && bucket===shiftBucket) return;
shiftBucket=bucket;

let dx=0, dy=0;
if(burnOn){
const R=10;
do{
dx=Math.round((Math.random()*2-1)*R);
dy=Math.round((Math.random()*2-1)*R);
}while(dx===shiftX && dy===shiftY);
}
shiftX=dx;
shiftY=dy;
document.documentElement.style.setProperty("--sx",dx+"px");
document.documentElement.style.setProperty("--sy",dy+"px");
}

// 秒表（最长 99 天 23:59:59；运行状态会保存）
// =====================================================
const SW_MAX=99*86400+23*3600+59*60+59;
const swSaved=loadJSON("flipClockStopwatch",{});

let swRunning=false;
let swTickId=null;
let swStartTime=0;
let swBaseMs=Math.max(0,Number(swSaved.base)||0);
let swLastLevel=-1;
let swLaps=Array.isArray(swSaved.laps) ? swSaved.laps.filter(l=>l && Number.isFinite(l.total)) : [];   // 每项 {n 序号, total 累计秒, split 距上一次的秒数}
let swLapCount=Math.max(0,Number(swSaved.count)||0);

function saveStopwatchState(){
saveJSON("flipClockStopwatch",{running:swRunning,start:swStartTime,base:swBaseMs,laps:swLaps,count:swLapCount});
}

function swElapsedSec(){
const ms=swBaseMs+(swRunning ? Math.max(0,Date.now()-swStartTime) : 0);   // 系统时间被往回调时不会出现负数
return Math.min(SW_MAX,Math.floor(ms/1000));
}

function renderStopwatch(){
const sec=swElapsedSec();
const lv=sec>=86400 ? 2 : sec>=3600 ? 1 : 0;    // 随时间增长自动多显示 时 / 天
renderDHMS(swDisp,sec,lv);
if(lv!==swLastLevel){
swLastLevel=lv;
applyScale();
}
return sec;
}

function swSync(){
swLapBtn.disabled=!swRunning;    // 只有在走表时才能计次
}

function swPause(){
if(!swRunning) return;
swBaseMs+=Date.now()-swStartTime;
swRunning=false;
if(swTickId!==null){ clearTick(swTickId); swTickId=null; }
swSync();
saveStopwatchState();
}

function swTick(){
if(renderStopwatch()>=SW_MAX) swPause();    // 到 99 天上限自动停住
}

function swBegin(){
swRunning=true;
swSync();
swTickId=setTick(swTick,250);
swTick();
}

swStartBtn.onclick=()=>{
if(swRunning || swElapsedSec()>=SW_MAX) return;
swStartTime=Date.now();
swBegin();
saveStopwatchState();
};

swPauseBtn.onclick=swPause;

swResetBtn.onclick=()=>{

// ---- 顶部大号「下一个闹钟」 ----
function nextOccurrence(alarm,now){
const [hh,mm]=alarm.time.split(":").map(Number);
for(let d=0;d<=7;d++){
const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d,hh,mm,0,0);
if(t<=now) continue;
if(alarm.days.length===0 || alarm.days.includes(t.getDay())) return t;
}
return null;
}

function untilText(ms){
const total=Math.max(1,Math.ceil(ms/60000));
const d=Math.floor(total/1440);
const h=Math.floor((total%1440)/60);
const m=total%60;
const t=T();
if(d>0) return fmt(t.untilD,{d,h});
if(h>0) return fmt(t.untilH,{h,m});
return fmt(t.untilM,{m});
}

function updateNextAlarm(){
const now=new Date();
let best=null, bestAlarm=null;

alarms.forEach(a=>{
if(!a.enabled) return;
const t=nextOccurrence(a,now);
if(t && (!best || t<best)){ best=t; bestAlarm=a; }
});

let str, sub;
if(best){
str=bestAlarm.time.replace(":","");
sub=fmt(T().nextSub,{name:bestAlarm.label||T().ringAlarm,t:untilText(best-now)});
}else{
str="----";
sub=T().noActive;
}

nextBox.classList.toggle("none",!best);
str.split("").forEach((v,i)=>nextAlarmDigits[i].set(v));
nextAlarmSub.textContent=sub;
}

// ---- 响铃 ----
function ringForAlarm(alarm,lateMin){
let sub=alarm.label ? alarm.time+" · "+alarm.label : alarm.time;
if(lateMin>=2) sub+=" · "+fmt(T().lateBy,{n:lateMin});
showRing(T().ringAlarm,sub,null,{
snooze:()=>snoozes.push({at:Date.now()+SNOOZE_MS,alarm})
});
}

function checkAlarms(){
const nowMs=Date.now();
updateNextAlarm();

// 从上次检查的时间补查到现在：浏览器限速、电脑短暂休眠都不会漏掉（最多补查 15 分钟）
let from=lastAlarmCheck ? Math.max(lastAlarmCheck,nowMs-CATCHUP_MS) : nowMs;
if(nowMs<lastAlarmCheck) from=nowMs;     // 系统时间被往回调过
lastAlarmCheck=nowMs;

const startMin=Math.floor(from/60000)*60000;
const endMin=Math.floor(nowMs/60000)*60000;

for(let t=startMin;t<=endMin;t+=60000){
const d=new Date(t);
const hhmm=pad2(d.getHours())+":"+pad2(d.getMinutes());
const day=d.getDay();

alarms.forEach(alarm=>{
if(!alarm.enabled || alarm.time!==hhmm) return;
if(alarm.days.length>0 && !alarm.days.includes(day)) return;

const key=alarm.id+"@"+t;
if(alarmFired.has(key)) return;
alarmFired.add(key);

ringForAlarm(alarm,Math.round((nowMs-t)/60000));

// 仅一次的闹钟响完自动关闭
if(alarm.days.length===0){
alarm.enabled=false;
saveAlarms();
renderAlarmList();
}
});
}

alarmFired.forEach(k=>{
if(Number(k.split("@")[1])<nowMs-3600000) alarmFired.delete(k);
});

// 稍后提醒到点
snoozes=snoozes.filter(s=>{
if(s.at<=nowMs){
ringForAlarm(s.alarm,0);
return false;
}
return true;
});
}

// 切回前台时马上补查一次
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible") checkAlarms();
});

// 番茄钟（运行状态会保存；每 N 轮长休；可跳过阶段）
// =====================================================
const pomoSaved=loadJSON("flipClockPomodoro",{});
const pomoState=loadJSON("flipClockPomoState",{});

let pomodoroWork=num(pomoSaved.work,1,99,25);
let pomodoroBreak=num(pomoSaved.brk,1,99,5);
let pomodoroLongBreak=num(pomoSaved.longBrk,1,99,15);
let pomodoroRounds=num(pomoSaved.rounds,1,10,4);

let pomodoroPhaseType=["work","break","longBreak"].includes(pomoState.phase) ? pomoState.phase : "work";
let pomodoroCyclesDone=num(pomoState.cycles,0,9999,0);
let pomodoroRunning=false;
let pomodoroTickId=null;
let pomodoroEndTime=0;
let pomodoroRemaining=0;

function savePomodoroSettings(){
saveJSON("flipClockPomodoro",{work:pomodoroWork,brk:pomodoroBreak,longBrk:pomodoroLongBreak,rounds:pomodoroRounds});
}

function savePomodoroState(){
saveJSON("flipClockPomoState",{
phase:pomodoroPhaseType,cycles:pomodoroCyclesDone,running:pomodoroRunning,end:pomodoroEndTime,rem:pomodoroRemaining
});
}

function pomodoroPhaseSeconds(){
if(pomodoroPhaseType==="work") return pomodoroWork*60;
if(pomodoroPhaseType==="break") return pomodoroBreak*60;
return pomodoroLongBreak*60;
}

function pomodoroPhaseInfo(type){
if(type==="work") return {text:T().phaseWork,cls:"work"};
if(type==="break") return {text:T().phaseShort,cls:"rest"};
return {text:T().phaseLong,cls:"rest"};
}

function pomoSync(){
pomodoroSkipBtn.disabled=!(pomodoroRunning || pomodoroRemaining>0);    // 阶段已经开始才能跳过
}

function renderPomodoroDots(){
const n=pomodoroRounds;
if(pomodoroDots.children.length!==n){
pomodoroDots.innerHTML="";
for(let i=0;i<n;i++){
const d=document.createElement("span");
d.className="pomo-dot";
pomodoroDots.appendChild(d);
}
}
// 工作阶段：当前轮 = 已完成数；休息阶段：仍属于刚完成的那一轮
const cur=pomodoroPhaseType==="work"
? pomodoroCyclesDone%n
: ((Math.max(1,pomodoroCyclesDone)-1)%n+n)%n;
[...pomodoroDots.children].forEach((d,i)=>{
d.classList.toggle("done",i<cur);
d.classList.toggle("cur",i===cur);
});
pomodoroDots.classList.toggle("running",pomodoroRunning);
}

function refreshPomodoroLabel(){
const info=pomodoroPhaseInfo(pomodoroPhaseType);
pomodoroPhase.textContent=info.text;
pomodoroPhase.className="phase-label "+info.cls;
pomodoroCount.textContent=fmt(T().cycles,{n:pomodoroCyclesDone});
renderPomodoroDots();
pomoSync();
}

function updatePomodoroPreview(){
if(!pomodoroRunning && pomodoroRemaining===0){
renderTime(pomodoroDigits,pomodoroPhaseSeconds());
}
}

function setPomodoroInputsDisabled(v){
pomodoroWheels.classList.toggle("disabled",v);
}

const wheelPWCtl=makeWheel(wheelPW,1,99,pomodoroWork,v=>{pomodoroWork=v;savePomodoroSettings();updatePomodoroPreview();},28,"work");
const wheelPBCtl=makeWheel(wheelPB,1,99,pomodoroBreak,v=>{pomodoroBreak=v;savePomodoroSettings();updatePomodoroPreview();},28,"shortBreak");
const wheelPLCtl=makeWheel(wheelPL,1,99,pomodoroLongBreak,v=>{pomodoroLongBreak=v;savePomodoroSettings();updatePomodoroPreview();},28,"longBreak");
const wheelPRCtl=makeWheel(wheelPR,1,10,pomodoroRounds,v=>{pomodoroRounds=v;savePomodoroSettings();renderPomodoroDots();},28,"rounds");

function stopPomodoroInterval(){
if(pomodoroTickId!==null){ clearTick(pomodoroTickId); pomodoroTickId=null; }
pomodoroRunning=false;
renderPomodoroDots();
pomoSync();
}

function startPomodoroInternal(){
const seconds=pomodoroRemaining>0 ? pomodoroRemaining : pomodoroPhaseSeconds();
pomodoroEndTime=Date.now()+seconds*1000;
pomodoroRemaining=0;
pomodoroRunning=true;
renderPomodoroDots();
pomoSync();
setPomodoroInputsDisabled(true);
pomodoroTickId=setTick(tickPomodoro,250);
tickPomodoro();
savePomodoroState();
}

// 进入下一阶段（工作 -> 短休/长休 -> 工作）；返回刚结束的阶段
function advancePomodoroPhase(){
const finished=pomodoroPhaseType;
if(finished==="work"){
pomodoroCyclesDone++;
// 每完成 N 个番茄（N = 轮次），下一次休息是长休息
pomodoroPhaseType=(pomodoroCyclesDone%pomodoroRounds===0) ? "longBreak" : "break";
}else{
pomodoroPhaseType="work";
}
pomodoroRemaining=0;
refreshPomodoroLabel();
return finished;
}

function tickPomodoro(){
const remaining=Math.ceil((pomodoroEndTime-Date.now())/1000);
if(remaining>0){
renderTime(pomodoroDigits,remaining);
return;
}

renderTime(pomodoroDigits,0);
stopPomodoroInterval();

const finished=advancePomodoroPhase();
pomodoroEndTime=0;
savePomodoroState();

const nextText=pomodoroPhaseInfo(pomodoroPhaseType).text;
showRing(
finished==="work" ? T().ringWorkDone : T().ringBreakDone,
fmt(T().ringNext,{x:nextText}),
()=>startPomodoroInternal()      // 点停止（或响满 60 秒）后自动进入下一阶段
);
}

pomodoroStartBtn.onclick=()=>{
if(pomodoroRunning) return;
unlockAudio();
startPomodoroInternal();
};

pomodoroPauseBtn.onclick=()=>{
if(!pomodoroRunning) return;
pomodoroRemaining=Math.max(1,Math.ceil((pomodoroEndTime-Date.now())/1000));
stopPomodoroInterval();
savePomodoroState();
};

// 跳过：直接结束当前阶段，进入下一阶段（跳过工作阶段也算完成一个番茄）
pomodoroSkipBtn.onclick=()=>{
if(!(pomodoroRunning || pomodoroRemaining>0)) return;
const wasRunning=pomodoroRunning;
stopPomodoroInterval();
advancePomodoroPhase();
renderTime(pomodoroDigits,pomodoroPhaseSeconds());
if(wasRunning){
startPomodoroInternal();
}else{
setPomodoroInputsDisabled(false);
savePomodoroState();
}
};

pomodoroResetBtn.onclick=()=>{
stopPomodoroInterval();
pomodoroRemaining=0;
pomodoroEndTime=0;
pomodoroPhaseType="work";
pomodoroCyclesDone=0;
setPomodoroInputsDisabled(false);
refreshPomodoroLabel();
renderTime(pomodoroDigits,pomodoroPhaseSeconds());
savePomodoroState();
};

// 刷新后恢复
(function restorePomodoro(){
refreshPomodoroLabel();
if(pomoState.running && Number(pomoState.end)>0){
pomodoroEndTime=Number(pomoState.end);
pomodoroRunning=true;
setPomodoroInputsDisabled(true);
pomodoroTickId=setTick(tickPomodoro,250);
tickPomodoro();        // 如果离开期间已经结束，会直接进入下一阶段并提醒
}else if(Number(pomoState.rem)>0){
pomodoroRemaining=Math.floor(Number(pomoState.rem));
setPomodoroInputsDisabled(true);
renderTime(pomodoroDigits,pomodoroRemaining);
refreshPomodoroLabel();
}else{
renderTime(pomodoroDigits,pomodoroPhaseSeconds());
}
})();

// ---- 时区计算：全部交给浏览器自带的时区数据，夏令时自动处理 ----
const zoneFmtCache={};

function zoneParts(zone,ms){
let f=zoneFmtCache[zone];
if(!f){
f=zoneFmtCache[zone]=new Intl.DateTimeFormat("en-US",{
timeZone:zone,hourCycle:"h23",
year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"
});
}
const o={};
f.formatToParts(ms).forEach(p=>o[p.type]=p.value);
return {y:+o.year,mo:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute,s:+o.second};
}

function zoneOffsetMin(zone,ms){
const p=zoneParts(zone,ms);
const asUTC=Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s);
return Math.round((asUTC-Math.floor(ms/1000)*1000)/60000);
}

function fmtOffset(min){
const sign=min<0 ? "-" : "+";
const a=Math.abs(min);
const h=Math.floor(a/60), m=a%60;
return "UTC"+sign+h+(m ? ":"+pad2(m) : "");
}

function dayDiff(c,o){
return Math.round((Date.UTC(c.y,c.mo-1,c.d)-Date.UTC(o.y,o.mo-1,o.d))/86400000);
}

// 太阳直射点（赤纬、经度），精度约 1°，画地图足够
function sunPos(ms){
const rad=Math.PI/180;
const d=ms/86400000+2440587.5-2451545.0;                        // 距 J2000 的天数
const g=((357.529+0.98560028*d)%360)*rad;
const q=(280.459+0.98564736*d)%360;
const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad;
const e=(23.439-0.00000036*d)*rad;
const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L));
const dec=Math.asin(Math.sin(e)*Math.sin(L));
const gmst=((280.46061837+360.98564736629*d)%360)*rad;
let lon=ra-gmst;
lon=Math.atan2(Math.sin(lon),Math.cos(lon));                   // 归一到 [-π, π]
return {dec,lon};
}

const cell=cssW/MAP_COLS;
const sun=sunPos(ms);
const sd=Math.sin(sun.dec), cd=Math.cos(sun.dec);

for(let r=0;r<MAP_ROWS;r++){
const phi=(MAP_LAT0-2*r)*rad;
const sp=Math.sin(phi)*sd, cp=Math.cos(phi)*cd;
const y=(r+0.5)*cell;

for(let c=0;c<MAP_COLS;c++){
const lam=(-179+2*c)*rad;
const elev=Math.asin(Math.max(-1,Math.min(1,sp+cp*Math.cos(lam-sun.lon))))/rad;
const t=Math.max(0,Math.min(1,(elev+6)/12));                  // 日出日落前后 6° 之内平滑过渡

let level, radius;
if(mapIsLand(r,c)){
level=Math.round(70+(210-70)*t);
radius=cell*0.4;
}else{
level=Math.round(22+(52-22)*t);
radius=cell*0.15;
}
g.fillStyle="rgb("+level+","+level+","+level+")";
g.beginPath();
g.arc((c+0.5)*cell,y,radius,0,6.2832);
g.fill();
}
}

// 已选城市的白色标记
worldCities.forEach(id=>{
const co=WORLD_COORDS[id];
if(!co) return;
const x=(co[1]+180)/360*cssW;
const y=((MAP_LAT0-co[0])/2+0.5)*cell;
if(y<0 || y>cssH) return;

g.strokeStyle="rgba(255,255,255,0.7)";
g.lineWidth=1;
g.beginPath();
g.arc(x,y,Math.max(4,cell*1.9),0,6.2832);
g.stroke();

g.fillStyle="#fff";
g.beginPath();
g.arc(x,y,Math.max(2,cell*0.9),0,6.2832);
g.fill();
});
}

// 一分钟内太阳只移动 0.25°，没必要每秒重画；选了城市、改了窗口大小才强制重画
function drawWorldMapIfNeeded(ms,force){
const key=Math.floor(ms/60000)+"|"+worldCities.join(",");
if(!force && key===mapKey) return;
mapKey=key;
drawWorldMap(ms);
}

window.addEventListener("resize",()=>renderWorld(true));

const worldDigits=buildFlipDisplay(worldDisplay);

function renderWorld(force){
let ms;
if(worldPlan){
const n=new Date();
ms=new Date(n.getFullYear(),n.getMonth(),n.getDate(),planH,planM,0,0).getTime();   // 会议时间：今天，你所在时区
}else{
ms=Date.now();
}

const own=zoneParts(OWN_ZONE,ms);
drawWorldMapIfNeeded(ms,force);

// ---- 上方大号：你的时间 ----
let h=own.h, suffix="";
if(!is24Hour){
suffix=h>=12 ? "PM" : "AM";
h=h%12||12;
}
(pad2(h)+pad2(own.mi)).split("").forEach((v,i)=>worldDigits[i].set(v));

const wk=T().week[new Date(Date.UTC(own.y,own.mo-1,own.d)).getUTCDay()];
const ownDate=lang==="zh"
? `${own.y}年${own.mo}月${own.d}日 星期${wk}`
: `${own.y}-${pad2(own.mo)}-${pad2(own.d)} ${wk}`;
worldTopLabel.textContent=worldPlan ? T().worldMeeting : T().worldYour;
worldTopSub.textContent=[suffix,ownDate,fmtOffset(zoneOffsetMin(OWN_ZONE,ms)),ownZoneName()].filter(Boolean).join(" · ");

// ---- 城市列表 ----
let html="";
if(worldCities.length===0){
html=`<div class="alarm-empty">${esc(T().noCities)}</div>`;
}else{
worldCities.forEach(id=>{
const c=WORLD_BY_ID[id];
let p;
try{ p=zoneParts(c.zone,ms); }catch(e){ return; }

let ch=p.h, cs="";
if(!is24Hour){
cs=ch>=12 ? "PM" : "AM";
ch=ch%12||12;
}

const diff=dayDiff(p,own);
const badge=diff===0 ? T().dayToday : diff<0 ? T().dayYesterday : T().dayTomorrow;
const icon=(p.h>=6 && p.h<18) ? ICON_SUN : ICON_MOON;

html+=`<div class="world-row">
<span class="world-ico">${icon}</span>
<div class="world-name">
<div class="wn">${esc(cityName(c))}</div>
<div class="ws">${esc(cityDateText(c.zone,ms))} · ${fmtOffset(zoneOffsetMin(c.zone,ms))}</div>
</div>
<div class="world-time"><div class="alarm-cards">${timeCards(pad2(ch)+":"+pad2(p.mi))}</div><span class="ampm-s">${cs}</span></div>
<span class="world-badge${diff!==0?" off":""}">${esc(badge)}</span>
<button class="alarm-del world-del idle-hide" data-id="${c.id}" aria-label="${esc(T().del)}" title="${esc(T().del)}">✕</button>
</div>`;
});
}

if(force || html!==worldSig){
worldList.innerHTML=html;
worldSig=html;
}
}

// 点城市行的 ✕ 删除
worldList.addEventListener("click",e=>{
const btn=e.target.closest(".world-del");
if(!btn) return;
worldCities=worldCities.filter(id=>id!==btn.dataset.id);
saveWorld();
renderWorld(true);
renderCityPicker();
});

// ---- 实时 / 会议规划 ----
const wheelWHCtl=makeWheel(wheelWH,0,23,planH,v=>{planH=v;renderWorld(false);},28,"unitHour");
const wheelWMCtl=makeWheel(wheelWM,0,59,planM,v=>{planM=v;renderWorld(false);},28,"min");

function setWorldMode(plan){
worldPlan=plan;
worldWrapper.classList.toggle("planning",plan);
worldLiveBtn.classList.toggle("active",!plan);
worldPlanBtn.classList.toggle("active",plan);
worldLiveBtn.setAttribute("aria-pressed",String(!plan));
worldPlanBtn.setAttribute("aria-pressed",String(plan));
worldPlanBox.style.display=plan ? "" : "none";

if(plan){
const n=new Date();
wheelWHCtl.set(n.getHours());      // 面板刚显示出来，需要重新定位滚轮
wheelWMCtl.set(n.getMinutes());
}
renderWorld(true);
applyScale();
worldWrapper.scrollTop=0;
}

worldLiveBtn.onclick=()=>setWorldMode(false);
worldPlanBtn.onclick=()=>setWorldMode(true);

// ---- 城市选择面板 ----
function renderCityPicker(){
const q=citySearch.value.trim().toLowerCase();
let html="";
let any=false;

WORLD_REGIONS.forEach(r=>{
const list=WORLD_CITIES.filter(c=>c.region===r.key && (!q || c.zh.includes(q) || c.en.toLowerCase().includes(q) || c.zone.toLowerCase().includes(q)));
if(!list.length) return;
any=true;
html+=`<div><div class="city-region">${esc(T()[r.label])}</div><div class="city-chips">`;
list.forEach(c=>{
const on=worldCities.includes(c.id);
html+=`<button type="button" class="ctrl-btn chip city-chip${on?" on":""}" data-id="${c.id}" aria-pressed="${on}">${on?"✓ ":""}${esc(cityName(c))}</button>`;
});
html+="</div></div>";
});

cityGroups.innerHTML=any ? html : `<div class="alarm-empty">${esc(T().noMatch)}</div>`;
}

cityGroups.addEventListener("click",e=>{
const b=e.target.closest(".city-chip");
if(!b) return;
const id=b.dataset.id;
worldCities=worldCities.includes(id) ? worldCities.filter(x=>x!==id) : worldCities.concat(id);
saveWorld();
const top=cityGroups.scrollTop;
renderCityPicker();
cityGroups.scrollTop=top;
renderWorld(true);
});

citySearch.addEventListener("input",renderCityPicker);

function openCityPicker(){
cityOverlay.classList.add("show");
citySearch.value="";
renderCityPicker();
citySearch.focus();
}

function closeCityPicker(){
cityOverlay.classList.remove("show");
worldAddBtn.focus();
}

worldAddBtn.onclick=openCityPicker;
cityClose.onclick=closeCityPicker;

cityOverlay.addEventListener("click",e=>{
if(e.target===cityOverlay) closeCityPicker();
});

document.addEventListener("keydown",e=>{
if(e.key==="Escape" && cityOverlay.classList.contains("show")) closeCityPicker();
});

// 每秒刷新（只在世界时钟页面可见时）
setTick(()=>{
if(worldWrapper.classList.contains("show")) renderWorld(false);
},1000);

setWorldMode(false);


// =====================================================
// 中英文文案应用到所有新增面板
// =====================================================
function applyNewLang(){
const t=T();
document.documentElement.lang=lang==="zh" ? "zh-CN" : "en";

document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t[el.dataset.i18n]);
document.querySelectorAll("[data-i18n-title]").forEach(el=>{
el.title=t[el.dataset.i18nTitle];
el.setAttribute("aria-label",t[el.dataset.i18nTitle]);
});
document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t[el.dataset.i18nPh]);
document.querySelectorAll("[data-aria-key]").forEach(el=>el.setAttribute("aria-label",t[el.dataset.ariaKey]));

[...weekdayPicker.children].forEach((b,i)=>b.textContent=weekBtnText(i));
renderPresetLabels();
renderAlarmList();
refreshPomodoroLabel();
renderLaps(true);
renderWorld(true);
renderCityPicker();
updateTitle();
applyScale();
}


// =====================================================
// 初始化
// =====================================================
changeLanguage();          // 同时会应用新增面板的文案、更新时钟、适配缩放
applyShift(true);
applyDim();

const urlMode=location.hash.slice(1);
let startMode=MODES.includes(urlMode) ? urlMode : localStorage.getItem("flipClockMode");
if(!MODES.includes(startMode)) startMode="clock";
switchMode(startMode);

setInterval(update,1000);
setTick(()=>{ applyDim(); applyShift(false); updateTitle(); },1000);
setTick(checkAlarms,1000);
checkAlarms();

showButtons();             // 打开页面时先显示 3 秒按钮，方便发现

</script>
